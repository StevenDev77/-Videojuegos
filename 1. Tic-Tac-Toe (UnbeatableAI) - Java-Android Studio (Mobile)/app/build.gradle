plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.winapptictactoe'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.winapptictactoe"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // No external dependencies: the app uses platform Android APIs only.
    // This keeps the migration close to the original self-contained WinForms app.
}
